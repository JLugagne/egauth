name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: CI only reads the repo (checkout). Jobs that need more must opt in explicitly.
permissions:
  contents: read

# Multi-module monorepo: the core flagship module (.) and the nested pgx adapter module
# (./adapters/pgx). The committed go.work resolves the core module from local disk for the adapter
# jobs, so CI is green before any tag is published. The core jobs run with GOWORK=off to resolve
# from the root go.mod alone, as external consumers do (no Docker). The root go.mod pins the adapter
# to a published version and keeps a local replace for development; the packaging job below proves a
# consumer can resolve that graph through the proxy.

jobs:
  test-core:
    name: Core — Test & Vet (${{ matrix.os }}, no Docker)
    runs-on: ${{ matrix.os }}
    # Hard cap: a hung test/must-not-wait job must not burn runner minutes (GitHub's default
    # job timeout is 360 minutes). Sized generously vs the observed ~10 min, so only true
    # runaways are killed.
    timeout-minutes: 30
    # OS matrix: crypto/timing-sensitive code (Argon2, HMAC, constant-time compares) can behave
    # differently across platforms, so the core suite runs on Linux, macOS and Windows. The Go
    # version is intentionally NOT a matrix dimension: the module's `go 1.26` directive is the
    # deliberate minimum (see TASK-035 / the keep-go-1.26 decision), and an older toolchain refuses
    # to build a `go 1.26` module — so there is no meaningful "prior stable Go" leg to test.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GOWORK: "off"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        # The core suite imports the pgx adapter's passkey package but no testcontainers, so it
        # tests with NO Docker daemon. GOWORK=off (job env) resolves the adapter from the local
        # replace pinned in the root go.mod.
        run: go test -race -failfast ./...

  consumer-smoke:
    name: Packaging — consumer module graph (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # External consumers cannot see this repo's local `replace` directives. This job proves the
    # root go.mod pins the adapter to a version the proxy can serve: the script builds a throwaway
    # consumer module and runs `go list -m all` + `go mod download all` with only a local file://
    # proxy. The warm-up download populates the cache the script serves; the script itself makes no
    # network access, so an unresolvable placeholder pseudo-version cannot slip through.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Warm the pinned adapter into the module cache
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          adapter_version="$(go list -m -f '{{.Version}}' github.com/JLugagne/egauth/adapters/pgx)"
          go mod download "github.com/JLugagne/egauth/adapters/pgx@${adapter_version}"

      - name: Consumer module smoke (offline file:// proxy)
        run: bash scripts/consumer-smoke.sh

  test-adapters-pgx:
    name: adapters/pgx — Test & Vet (Docker/testcontainers)
    runs-on: ubuntu-latest
    # Hard cap (see test-core); the full Docker/testcontainers suite normally takes ~10-15 min.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: adapters/pgx
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'adapters/pgx/go.mod'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        # The adapter module owns the Docker-dependent pgx conformance/integration tests.
        # ubuntu-latest ships the Docker engine, so testcontainers-go works out of the box.
        # The committed go.work (at the repo root) resolves the core module from local disk.
        # NOTE: this runs the DEFAULT (untagged) build. The `integration`-tagged real-Postgres
        # contract suite (adapters/pgx/sessions/integration_test.go) is exercised by the dedicated
        # test-adapters-pgx-integration job below.
        run: go test -race -failfast ./...

  test-adapters-pgx-integration:
    name: adapters/pgx — Integration contract suite (real Postgres service)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs the `integration`-tagged sessions.Store contract suite against a REAL Postgres, proving
    # the pgx store at runtime — not just via the in-memory contract mock. We use a Postgres
    # SERVICE container and point the suite at it through TEST_DATABASE_URL (the test honours that
    # env var and skips testcontainers when it is set), so this job needs no Docker-in-Docker.
    # The build tag keeps this suite out of the default `go test ./...`, so the unit-test jobs stay
    # DB-free.
    defaults:
      run:
        working-directory: adapters/pgx
    services:
      postgres:
        # Pinned by digest: the mutable tag is recorded here for readability, the digest is the
        # immutable reference. To update, run `docker pull postgres:16-alpine` then
        # `docker inspect --format='{{index .RepoDigests 0}}' postgres:16-alpine` and replace the digest.
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before the steps run.
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: "postgres://testuser:testpass@localhost:5432/testdb?sslmode=disable"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'adapters/pgx/go.mod'
          cache: true

      - name: Run go vet (integration tag)
        run: go vet -tags=integration ./...

      - name: Run integration contract suite against the Postgres service
        # The suite applies the embedded migrations to the service DB, then runs the shared
        # storetest.StoreContractTesting suite plus the explicit FindSessionByHash expiry-boundary
        # check. -tags=integration is what pulls integration_test.go into the build.
        run: go test -race -failfast -tags=integration ./sessions/...

  test-short:
    name: Docker-less unit tests (go test -short)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Proves the documented Docker-less contributor path: `go test -short ./...` passes in BOTH
    # modules with no Docker daemon — every testcontainers test skips under -short. We do NOT start
    # any Docker service in this job, so a regression that makes a unit test depend on Docker fails
    # here. (The full pgx conformance suites still run in test-adapters-pgx with Docker.)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Core — go test -short (no Docker)
        env:
          GOWORK: "off"
        run: go test -short ./...

      - name: adapters/pgx — go test -short (no Docker; testcontainers tests skip)
        working-directory: adapters/pgx
        run: go test -short ./...

  test-adapters-otel:
    name: Test adapters/otel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # adapters/otel is a separate module (an OpenTelemetry event.Sink) in the go.work workspace that
    # otherwise had no CI coverage. It carries no Docker/testcontainers dependency, so vet + test is
    # sufficient; it resolves the core module from the workspace.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: adapters/otel — go vet
        working-directory: adapters/otel
        run: go vet ./...

      - name: adapters/otel — go test -race
        working-directory: adapters/otel
        run: go test -race ./...

  fuzz:
    name: Fuzz (short pass on untrusted-input parsers)
    runs-on: ubuntu-latest
    # 6 targets x 30s fuzz budget + target compilation; capped well above that.
    timeout-minutes: 20
    # The fuzz targets cover the highest-value attack surface of an auth SDK: the parsers fed
    # attacker-controlled input (Argon2 PHC, JWT decode, OAuth state cookie, WebAuthn CBOR/base64).
    # All live in the core module, so GOWORK=off. A short pass per target catches panics (DoS) and
    # mis-parses on every push without a long-running fuzz budget.
    env:
      GOWORK: "off"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Short fuzz pass
        run: |
          set -euo pipefail
          go test -run='^$' -fuzz=FuzzNeedsRehash                     -fuzztime=30s ./passwords/argon2
          go test -run='^$' -fuzz=FuzzCompare                         -fuzztime=30s ./passwords/argon2
          go test -run='^$' -fuzz=FuzzUnpackState                     -fuzztime=30s ./oauth
          go test -run='^$' -fuzz=FuzzVerifyAccessToken               -fuzztime=30s ./tokens/jwt
          go test -run='^$' -fuzz=FuzzParseCredentialCreationResponse -fuzztime=30s ./passkey
          go test -run='^$' -fuzz=FuzzParseCredentialRequestResponse  -fuzztime=30s ./passkey

  coverage:
    name: Coverage (core security packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-gating: produces a coverage profile for the security-critical core packages
    # (passwords, tokens, oauth, passkey), prints the total to the log, and uploads the profile.
    env:
      GOWORK: "off"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Generate coverage profile
        run: |
          go test -covermode=atomic -coverprofile=coverage.out \
            ./passwords/... ./tokens/... ./oauth/... ./passkey/...
          echo "Total coverage:"
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  govulncheck:
    name: Vulnerability Check (all modules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: govulncheck — core
        env:
          GOWORK: "off"
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: govulncheck — adapters/pgx
        working-directory: adapters/pgx
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: govulncheck — adapters/otel
        working-directory: adapters/otel
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  lint:
    name: Linting (both modules)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run golangci-lint — core
        # Use go run so golangci-lint is compiled with the same Go version as the project,
        # bypassing the "lower than targeted Go version" error.
        env:
          GOWORK: "off"
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run --timeout=5m

      - name: Run golangci-lint — adapters/pgx
        working-directory: adapters/pgx
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run --timeout=5m

  docs:
    name: Docs API Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check doc code samples against the current API
        # Every egauth-qualified symbol in a ```go fence under docs/, in README.md, and in every
        # Go package doc comment (incl. the root doc.go) must resolve to a real exported identifier
        # (via `go doc`), so prose cannot drift from the API without failing CI. doctest resolves
        # adapters/pgx/* symbols too, which needs the workspace to see the adapter module — the
        # committed go.work provides it (no GOWORK=off here). See internal/doctest.
        run: go run ./internal/doctest
