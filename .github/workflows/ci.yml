name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: CI only reads the repo (checkout). Jobs that need more must opt in explicitly.
permissions:
  contents: read

# Multi-module monorepo: the core module (.), the published adapters (./adapters/pgx,
# ./adapters/otel) and the unpublished guard module (./tools). Each adapter go.mod replaces the core
# module with the checkout, so CI is green before any tag is published. The core jobs run with
# GOWORK=off to resolve from the root go.mod alone, as external consumers do (no Docker). The core
# module has no dependency on any adapter; the packaging job below proves a consumer can resolve
# all three published modules offline.

jobs:
  test-core:
    name: Core — Test & Vet (${{ matrix.os }}, no Docker)
    runs-on: ${{ matrix.os }}
    # Hard cap: a hung test/must-not-wait job must not burn runner minutes (GitHub's default
    # job timeout is 360 minutes). Sized generously vs the observed ~10 min, so only true
    # runaways are killed.
    timeout-minutes: 30
    # OS matrix: crypto/timing-sensitive code (Argon2, HMAC, constant-time compares) can behave
    # differently across platforms, so the core suite runs on Linux, macOS and Windows. The Go
    # version is intentionally NOT a matrix dimension: setup-go reads the module's `toolchain` line
    # (which carries the standard-library security fixes), and an older toolchain refuses to build
    # the module, so there is no meaningful "prior stable Go" leg to test.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GOWORK: "off"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        # The core suite needs no Docker daemon. GOWORK=off (job env) tests the standalone module.
        # internal/journeytest is excluded: under -race it exceeds the default test timeout and the
        # journey-short and journey-full jobs already run it.
        shell: bash
        run: go test -race -failfast -timeout 30m $(go list ./... | grep -v '/internal/journeytest$')

  consumer-smoke:
    name: Packaging — consumer module graph (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # External consumers cannot see this repo's local `replace` directives or go.work. The script
    # warms the module cache from the public proxy with the dependency graph of every published
    # module, then runs `go list -m all`, `go mod download all`, `go build ./...` and `go vet` of
    # one named package per published module in a throwaway consumer module with only a local
    # file:// proxy. The offline run is the assertion.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Consumer module smoke (warm-up + offline assertion)
        run: bash scripts/consumer-smoke.sh

  versions:
    name: Version sync (G17)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: VERSION against every sibling require, CORE_VERSION and RELEASING.md
        run: bash scripts/sync-versions.sh --check

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run script tests
        env:
          GOWORK: "off"
        run: go test -count=1 ./scripts/...

  archtest:
    name: Architecture guards (tools/archtest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'tools/go.mod'
          cache: true
          cache-dependency-path: tools/go.sum

      - name: Run guards
        # -count=1: the guards read repository files the test cache does not track.
        working-directory: tools
        env:
          GOWORK: "off"
        run: go test -count=1 ./archtest/...

  doclint:
    name: Doc lint (tools/doclint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'tools/go.mod'
          cache: true
          cache-dependency-path: tools/go.sum

      - name: Run doclint
        working-directory: tools
        env:
          GOWORK: "off"
        run: go run ./doclint -check

      - name: Run doclint unit tests
        working-directory: tools
        env:
          GOWORK: "off"
        run: go vet ./... && go test -count=1 ./doclint/...

  journey-short:
    name: Journey matrix (short)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: "off"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run the pinned short matrix
        run: go test -short -timeout 20m ./internal/journeytest/...

  journey-full:
    name: Journey matrix (full) and G7b
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOWORK: "off"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run the full matrix, probes and the G7b semantic opt-out guard
        run: go test -count=1 -timeout 40m ./internal/journeytest/...

  test-adapters-pgx:
    name: adapters/pgx — Test & Vet (Docker/testcontainers)
    runs-on: ubuntu-latest
    # Hard cap (see test-core); the full Docker/testcontainers suite normally takes ~10-15 min.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: adapters/pgx
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'adapters/pgx/go.mod'
          cache: true

      - name: Require a healthy Docker daemon
        # testcontainers skips, rather than fails, when the provider is unhealthy: fail here so the
        # G29 legacy upgrade and e2e journeys can never be silently skipped.
        run: docker info

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        # The adapter module owns the Docker-dependent pgx conformance/integration tests, including
        # adapters/pgx/e2e (journey harness on real Postgres and the G29 legacy upgrade).
        # ubuntu-latest ships the Docker engine, so testcontainers-go works out of the box.
        # The replace directive in adapters/pgx/go.mod resolves the core module from the checkout.
        run: go test -race -failfast -timeout 30m ./...

  test-short:
    name: Docker-less unit tests (go test -short)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Proves the documented Docker-less contributor path: `go test -short ./...` passes in the core
    # and pgx modules (otel has its own job) with no Docker daemon: every testcontainers test
    # skips under -short. We do NOT start any Docker service in this job, so a regression that makes a unit test depend on Docker fails
    # here. (The full pgx conformance suites still run in test-adapters-pgx with Docker.)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Core — go test -short (no Docker)
        env:
          GOWORK: "off"
        run: go test -short -timeout 20m ./...

      - name: adapters/pgx — go test -short (no Docker; testcontainers tests skip)
        working-directory: adapters/pgx
        run: go test -short ./...

  test-adapters-otel:
    name: Test adapters/otel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # adapters/otel is a separate module (an OpenTelemetry event.Sink) in the go.work workspace that
    # otherwise had no CI coverage. It carries no Docker/testcontainers dependency, so vet + test is
    # sufficient; the replace directive in its go.mod resolves the core module from the checkout.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'adapters/otel/go.mod'
          cache: true

      - name: adapters/otel — go vet
        working-directory: adapters/otel
        run: go vet ./...

      - name: adapters/otel — go test -race
        working-directory: adapters/otel
        run: go test -race ./...

  fuzz:
    name: Fuzz (short pass on untrusted-input parsers)
    runs-on: ubuntu-latest
    # 4 targets x 60s fuzz budget + target compilation; capped well above that.
    timeout-minutes: 25
    # The fuzz targets cover the parsers fed attacker-controlled input (Argon2 PHC, sealed-blob
    # unseal, redirect target parsing). All live in the core module, so GOWORK=off. A short pass per target
    # catches panics (DoS) and mis-parses on every push without a long-running fuzz budget.
    env:
      GOWORK: "off"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Short fuzz pass
        run: |
          set -euo pipefail
          go test -run='^$' -fuzz=FuzzNeedsRehash                     -fuzztime=60s ./passwords/argon2
          go test -run='^$' -fuzz=FuzzCompare                         -fuzztime=60s ./passwords/argon2
          go test -run='^$' -fuzz=FuzzUnseal                          -fuzztime=60s ./internal/core
          go test -run='^$' -fuzz=FuzzParse                           -fuzztime=60s ./internal/redirect

  coverage:
    name: Coverage (core security packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-gating: produces a coverage profile for the security-critical core packages
    # (passwords, core, redirect, sealing, keys), prints the total to the log, and uploads the profile.
    env:
      GOWORK: "off"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Generate coverage profile
        run: |
          go test -covermode=atomic -coverprofile=coverage.out \
            ./passwords/... ./internal/core/... ./internal/redirect/... ./internal/sealing/... ./internal/keys/...
          echo "Total coverage:"
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  govulncheck:
    name: Vulnerability Check (all modules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: govulncheck (pinned in the Makefile)
        run: make vulncheck

  lint:
    name: Linting (all modules)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: golangci-lint (pinned in the Makefile; runs the same Go as the project)
        run: make lint
